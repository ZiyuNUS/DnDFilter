project_name: kitti10_fold8
run_name: kitti10_fold8

use_wandb: true # set to false if you don't want to log to wandb
train: true
batch_size: 99
eval_batch_size: 99
epochs: 1000
gpu_ids: [0]
num_workers: 1
lr: 1e-4
optimizer: adamw
clipping: False
max_norm: 1.
scheduler: "cosine"
warmup: True
warmup_epochs: 4
seed: 0

load_run: kitti10_fold8/s1

training_setting: "step_1"

vision_encoder: CNN
encoding_size: 128
obs_encoder: efficientnet-b0
attn_unet: False
cond_predict_scale: False
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4
down_dims: [64, 128, 256]

# diffusion model params
num_diffusion_iters: 10

# normalization for the action space
normalize: True

# context
context_type: temporal
context_size: 1 # 5

# action output params
len_traj_pred: 4

# dataset specific parameters
image_size: [150, 50] # width, height
datasets:
  RED:
    train_data_folder: dataset/KITTI/data_odometry_color
    test_data_folder: dataset/KITTI/data_odometry_color
    train: DND_train/data/data_splits/KITTI10_fold_8/train/
    test: DND_train/data/data_splits/KITTI10_fold_8/test/
    end_slack: 0
    negative_mining: True
    record_spacing : 1

## =0 turns off
print_log_freq: 1 # in iterations
pairwise_test_freq: 0 # in epochs
eval_fraction: 1
wandb_log_freq: 1 # in iterations
eval_freq: 50 # in epochs